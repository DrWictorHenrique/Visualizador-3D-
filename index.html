ren.toneMapping=THREE.ACESFilmicToneMapping; ren.toneMappingExposure=1.05;
ren.outputColorSpace=THREE.SRGBColorSpace;
ren.shadowMap.enabled=true; ren.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(ren.domElement);
const scene=new THREE.Scene();

/* estudio de alto contraste: caixa escura + softboxes muito claras.
   e o contraste que faz o dourado ler como espelho. */
function estudio(){
  const e=new THREE.Scene(), cx=new THREE.BoxGeometry(1,1,1); cx.deleteAttribute('uv');
  const box=(cor,int,pos,esc)=>{const o=new THREE.Mesh(cx,new THREE.MeshBasicMaterial(
    {color:new THREE.Color(cor).multiplyScalar(int)})); o.position.set(...pos); o.scale.set(...esc); e.add(o);};
  e.add(new THREE.Mesh(new THREE.BoxGeometry(60,32,60),
    new THREE.MeshBasicMaterial({color:0x2b3040,side:THREE.BackSide})));
  box(0xffffff,22,[  0, 15.2,  2],[20,.3,16]);
  box(0xfff0d6,17,[-18,  6,   6],[.3,13,16]);
  box(0xd9e9ff,13,[ 18,  7,  -4],[.3,13,16]);
  box(0xffffff, 9,[  0,  4, -21],[26,13,.3]);
  box(0xfff0d4, 1.35,[  0,  6,  24],[46,26,.3]);
  box(0xffffff,16,[-12, 11,  20],[13, 8,.3]);
  box(0xfff2dc,11,[ 13,  0,  20],[ 9,11,.3]);
  box(0x11141c, 1,[  0,-14,   0],[40,.3,40]);
  return e;
}
const pm=new THREE.PMREMGenerator(ren);
scene.environment=pm.fromScene(estudio(),0.02).texture;

const ESCURO=0x141d38, CLARO=0xb3bac8; let escuro=false;
const cam=new THREE.PerspectiveCamera(31,innerWidth/innerHeight,1,6000);
const ctl=new OrbitControls(cam,ren.domElement);
ctl.enableDamping=true; ctl.dampingFactor=.07; ctl.enablePan=false;
ctl.minDistance=250; ctl.maxDistance=1200; ctl.maxPolarAngle=Math.PI*.52; ctl.autoRotateSpeed=1.5;

function forma(c){const s=new THREE.Shape();
  c.outer.forEach(([x,y],i)=> i?s.lineTo(x,y):s.moveTo(x,y));
  (c.holes||[]).forEach(h=>{const p=new THREE.Path();
    h.forEach(([x,y],i)=> i?p.lineTo(x,y):p.moveTo(x,y)); s.holes.push(p);});
  return s;}
function solido(cs,esp,mat,z){const g=new THREE.Group();
  cs.forEach(c=>{const geo=new THREE.ExtrudeGeometry(forma(c),
    {depth:esp,bevelEnabled:true,bevelThickness:.2,bevelSize:.2,bevelSegments:2,curveSegments:14});
    geo.computeVertexNormals(); const m=new THREE.Mesh(geo,mat);
    m.castShadow=true; m.receiveShadow=true; g.add(m);});
  g.position.z=z; return g;}

const vidro=e=>new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:.02,
  transmission:1,thickness:e,ior:1.49,transparent:true,clearcoat:1,clearcoatRoughness:.02,
  attenuationDistance:700,attenuationColor:new THREE.Color(0xe4f0f6),
  envMapIntensity:1.25,side:THREE.DoubleSide});
const cristal=vidro(7), cristalBase=vidro(26);
const ouro=new THREE.MeshStandardMaterial({color:0xEBBC45,metalness:1,roughness:.07,envMapIntensity:1.35});
const branco=new THREE.MeshStandardMaterial({color:0xf8f8f6,metalness:0,roughness:.5,envMapIntensity:.55});
const vinil=new THREE.MeshStandardMaterial({color:0xf4f4f2,metalness:0,roughness:.78,envMapIntensity:.3});

const D=G.dims, peca=new THREE.Group();
peca.add(solido(G.painel,D.painelE,cristal,-D.painelE/2));
/* adesivo branco na face frontal do cristal: mascara a fita e deixa o verso branco */
peca.add(solido(G.adesivo,D.adesivoE,vinil,D.painelE/2-0.01));
peca.add(solido(G.num,D.douradoE,ouro,D.painelE/2));
peca.add(solido(G.anos,D.brancoE,branco,D.painelE/2+D.douradoE));
const base=solido(G.base,D.baseE,cristalBase,0);
base.rotation.x=-Math.PI/2; base.position.z=D.baseP/2;
const wb=new THREE.Group(); wb.add(base); wb.position.y=-D.baseE; peca.add(wb);
peca.children.forEach(o=>o.position.x-=D.baseL/2);
const alvoY=(D.painelH-D.baseE)/2; peca.position.y=-alvoY;
scene.add(peca);

const piso=new THREE.Mesh(new THREE.CircleGeometry(1600,64),
  new THREE.MeshStandardMaterial({color:0x7f8799,roughness:.9,metalness:.02}));
piso.rotation.x=-Math.PI/2; piso.position.y=-alvoY-D.baseE-.3; piso.receiveShadow=true; scene.add(piso);

const k=new THREE.DirectionalLight(0xffffff,1.55); k.position.set(230,430,480); k.castShadow=true;
k.shadow.mapSize.set(2048,2048);
const sc=k.shadow.camera; sc.left=-250;sc.right=250;sc.top=300;sc.bottom=-250;sc.near=60;sc.far=1400;
k.shadow.bias=-.0012; k.shadow.radius=4; scene.add(k);
const f=new THREE.DirectionalLight(0xcfe0ff,.45); f.position.set(-360,200,-180); scene.add(f);
scene.add(new THREE.HemisphereLight(0xffffff,0x8e97a8,.22));

function pintaFundo(){const c=escuro?ESCURO:CLARO;
  scene.background=new THREE.Color(c); scene.fog=new THREE.Fog(c,760,2100);
  piso.material.color.setHex(escuro?0x0f1830:0x7f8799);
  ren.toneMappingExposure=escuro?.95:1.0;}
pintaFundo();

const V={frente:[0,34,560],tresq:[330,205,425],lado:[520,110,145],verso:[-150,120,-520]};
const vai=v=>{const[a,b,c]=V[v];cam.position.set(a,b,c);ctl.target.set(0,0,0);ctl.update();};
vai('tresq'); ctl.autoRotate=true;
const bg=document.getElementById('bGira');
bg.onclick=()=>{ctl.autoRotate=!ctl.autoRotate;bg.setAttribute('aria-pressed',ctl.autoRotate);};
document.getElementById('bFrente').onclick=()=>vai('frente');
document.getElementById('b34').onclick=()=>vai('tresq');
document.getElementById('bLado').onclick=()=>vai('lado');
document.getElementById('bVerso').onclick=()=>vai('verso');
const bf=document.getElementById('bFundo');
bf.onclick=()=>{escuro=!escuro;pintaFundo();bf.setAttribute('aria-pressed',escuro);};
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  ren.setSize(innerWidth,innerHeight);});
let n=0;(function loop(){requestAnimationFrame(loop);ctl.update();ren.render(scene,cam);
  if(++n===3){const c=document.getElementById('carr');c.classList.add('off');
    setTimeout(()=>c.style.display='none',500);document.body.dataset.pronto='1';}})();
</script></body></html>
