<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>70 Anos · Display de Mesa</title>
<style>
:root{--tx:#1a2238;--tx2:#5d6478;--btn:rgba(255,255,255,.72);--btnb:rgba(20,30,60,.13);--btnh:#fff;
  --on:#1a2238;--ontx:#fff;--rot:rgba(255,255,255,.94);--rottx:#1a2238;--bg:#ecebe8}
body.escuro{--tx:#eef1f7;--tx2:rgba(238,241,247,.58);--btn:rgba(255,255,255,.08);--btnb:rgba(255,255,255,.18);
  --btnh:rgba(255,255,255,.16);--on:#eef1f7;--ontx:#15171c;--rot:rgba(14,16,22,.82);--rottx:#fff;--bg:#17191e}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}canvas{display:block;touch-action:none}
#cap{position:fixed;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 18px 0;text-align:center;pointer-events:none;z-index:3}
#cap h1{font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
#cap p{font-size:12px;margin-top:6px;color:var(--tx2);letter-spacing:.03em;line-height:1.5}
#hud{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3}
.lin{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--btn);border:1px solid var(--btnb);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto}
.seg button{border:0;background:transparent}
button{pointer-events:auto;border:1px solid var(--btnb);background:var(--btn);color:var(--tx);font:inherit;font-size:13px;
  letter-spacing:.02em;padding:8px 15px;border-radius:999px;cursor:pointer;backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);transition:background .2s,color .2s}
button:hover{background:var(--btnh)}
button[aria-pressed="true"]{background:var(--on);color:var(--ontx)}
button:disabled{opacity:.45;cursor:default}
#est{font-size:11.5px;color:var(--tx2);letter-spacing:.04em;display:flex;align-items:center;gap:8px;min-height:16px}
#barra{width:70px;height:3px;border-radius:2px;background:var(--btnb);overflow:hidden}
#barra i{display:block;height:100%;width:0;background:var(--tx);transition:width .3s}
.rot{position:fixed;left:0;top:0;z-index:2;pointer-events:none;display:flex;align-items:center;gap:7px;opacity:0;white-space:nowrap}
.rot i{width:8px;height:8px;border-radius:50%;background:var(--rottx);box-shadow:0 0 0 3px var(--rot);flex:none}
.rot span{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--rottx);background:var(--rot);
  padding:5px 10px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.rot.esq{flex-direction:row-reverse}
#carr{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.1em;color:var(--tx2);
  background:var(--bg);transition:opacity .5s;z-index:9}
#carr.off{opacity:0;pointer-events:none}
@media (max-width:560px){#cap h1{font-size:13px}#cap p{font-size:11px}button{font-size:12px;padding:7px 12px}}
</style></head><body>
<div id="app"></div>
<div id="cap"><h1 id="tit"></h1><p id="sub"></p></div>
<div id="rotulos"></div>
<div id="hud">
  <div id="est"><span id="estTx">Arraste para girar &middot; pince ou role para aproximar</span><span id="barra" hidden><i></i></span></div>
  <div class="lin"><div class="seg" role="group" aria-label="Vistas">
    <button data-v="frente">Frente</button><button data-v="tresq" aria-pressed="true">3/4</button>
    <button data-v="lado">Lado</button><button data-v="verso">Verso</button><button data-v="cima">Cima</button></div></div>
  <div class="lin">
    <button id="bCam" aria-pressed="false">Ver camadas</button>
    <button id="bGira" aria-pressed="false">Girar</button>
    <button id="bTema" aria-pressed="false">Estúdio escuro</button>
    <button id="bFoto" disabled>Baixar foto</button>
  </div>
</div>
<div id="carr">preparando o estúdio…</div>

/* ---------- estudio: ambiente procedural (mesmo para raster e path tracing) ----------
   Softboxes analiticas num domo neutro. As placas frontais definem o reflexo do espelhado visto de frente. */
function ambiente(tema){
  const w=1024,h=512,d=new Float32Array(w*h*4);
  const n=v=>{const l=Math.hypot(...v);return v.map(x=>x/l);};
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const escuro=tema==='escuro';
  const k=ESC;
  const caixas=[
    [[0,1,.12],.40,.30,4.5,[1,1,1]],        [[-1,.38,.38],.30,.40,4.6,[1,.95,.87]],
    [[1,.42,-.15],.26,.36,3.4,[.88,.93,1]], [[0,.30,-1],.50,.26,2.2,[1,1,1]],
    [[-.45,.48,.88],.20,.07,7.0,[1,1,1]],   [[.55,.22,.8],.05,.20,6.0,[1,.95,.88]],
    [[-.15,.06,1],.42,.025,4.5,[1,.97,.92]],  [[0,.8,1],.55,.2,3.4,[1,.98,.95]]
  ].map(([c,a,b,I,cor])=>{c=n(c);let r=n(cross(c,[0,1,0]));if(!isFinite(r[0]))r=[1,0,0];const u=cross(r,c);return{c,r,u,a,b,I:I*k,cor};});
  /* hemisferio de baixo = piso visto pelo modo rapido (o path tracing ve o piso real); claro no centro, cai ate o horizonte */
  const ceu=(escuro?[.11,.115,.13]:[.74,.74,.72]).map(v=>v*ESC);
  const chH=(escuro?[.10,.105,.12]:[.95,.95,.92]).map(v=>v*ESC), chN=(escuro?[.75,.76,.8]:[2.7,2.7,2.6]).map(v=>v*ESC);
  const sm=t=>t<=0?0:t>=1?1:t*t*(3-2*t);
  for(let j=0;j<h;j++){const th=((j+.5)/h-.5)*Math.PI, ct=Math.cos(th), y=Math.sin(th);
    for(let i=0;i<w;i++){const ph=((i+.5)/w-.5)*2*Math.PI, x=ct*Math.cos(ph), z=ct*Math.sin(ph);
      const tn=sm(-y/.8), chao=[0,1,2].map(c=>chH[c]+(chN[c]-chH[c])*tn);
      const t=sm((y+.04)/.12); let R=chao[0]+(ceu[0]-chao[0])*t, G=chao[1]+(ceu[1]-chao[1])*t, Bc=chao[2]+(ceu[2]-chao[2])*t;
      /* bandeira preta atras da camera: da profundidade ao espelhado */
      const fl=1-.88*sm((z-.1)/.45)*(1-sm((y-.3)/.35))*sm((y+.01)/.05); R*=fl; G*=fl; Bc*=fl;
      for(const q of caixas){const cz=x*q.c[0]+y*q.c[1]+z*q.c[2]; if(cz<=0)continue;
        const a=Math.abs(Math.atan((x*q.r[0]+y*q.r[1]+z*q.r[2])/cz))/q.a, b=Math.abs(Math.atan((x*q.u[0]+y*q.u[1]+z*q.u[2])/cz))/q.b;
        if(a>=1||b>=1)continue; const f=(1-sm((a-.8)/.2))*(1-sm((b-.8)/.2))*q.I;
        R+=f*q.cor[0];G+=f*q.cor[1];Bc+=f*q.cor[2];}
      const o=(j*w+i)*4; d[o]=R;d[o+1]=G;d[o+2]=Bc;d[o+3]=1;}}
  const t=new THREE.DataTexture(d,w,h,THREE.RGBAFormat,THREE.FloatType);
  t.mapping=THREE.EquirectangularReflectionMapping; t.colorSpace=THREE.LinearSRGBColorSpace;
  t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter; t.generateMipmaps=false; t.needsUpdate=true; return t;
}

/* ---------- materiais fisicos ----------

const P=(o)=>new THREE.MeshPhysicalMaterial(o);
function cristal(){return P({color:0xffffff,metalness:0,roughness:.015,transmission:1,thickness:5,ior:1.49,
  attenuationColor:new THREE.Color(0xd9f1ea),attenuationDistance:260,specularIntensity:1});}
const ESPELHO={espelhado_dourado:[0xF2C552,0x6e5320],espelhado_prata:[0xF0F2F4,0x6c7179],
  espelhado_rose:[0xEDB29A,0x7a4f40],espelhado_cobre:[0xDE8D5E,0x6e3f24]};
function materiais(L){
  const m=L.material, cor=L.cor!=null?new THREE.Color(L.cor):null;
  if(m==='cristal'){const c=cristal();return [c,c];}
  if(ESPELHO[m]){const[a,b]=ESPELHO[m];
    return [P({color:a,metalness:1,roughness:.035,clearcoat:1,clearcoatRoughness:.015}),
            P({color:b,metalness:.55,roughness:.3})];}
  if(m==='vinil'){const v=P({color:cor||0xf4f4f2,roughness:.92});return [v,v];}
  if(m==='fosco'){const c=cor||new THREE.Color(0xdddddd);return [P({color:c,roughness:.8}),P({color:c.clone().multiplyScalar(.88),roughness:.85})];}
  const c=cor||new THREE.Color(m==='preto'?0x121316:0xfcfcfb);
  return [P({color:c,roughness:.2,clearcoat:.8,clearcoatRoughness:.04}),
          P({color:c.clone().multiplyScalar(m==='preto'?1.4:.9),roughness:.42})];
}

function forma(c){const s=new THREE.Shape();c.outer.forEach(([x,y],i)=>i?s.lineTo(x,y):s.moveTo(x,y));
  (c.holes||[]).forEach(h=>{const p=new THREE.Path();h.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));s.holes.push(p);});return s;}
/* Uma malha por material: o path tracer embaralha materiais quando uma malha recebe um array de materiais. */
function porMaterial(geo){if(geo.index)geo=geo.toNonIndexed();const A=geo.attributes,por={};
  geo.groups.forEach(gr=>(por[gr.materialIndex]||(por[gr.materialIndex]=[])).push(gr));
  return Object.entries(por).map(([mi,grs])=>{let n=0;grs.forEach(g=>n+=g.count);const out=new THREE.BufferGeometry();
    for(const nome of ['position','normal','uv']){const at=A[nome];if(!at)continue;const k=at.itemSize,arr=new Float32Array(n*k);let o=0;
      grs.forEach(g=>{arr.set(at.array.subarray(g.start*k,(g.start+g.count)*k),o*k);o+=g.count;});
      out.setAttribute(nome,new THREE.BufferAttribute(arr,k));}
    return [+mi,out];});}
function solido(cs,esp,mats,bisel){const g=new THREE.Group();
  cs.forEach(c=>{const geo=new THREE.ExtrudeGeometry(forma(c),{depth:esp,bevelEnabled:bisel,bevelThickness:B,bevelSize:B,bevelSegments:2,curveSegments:12});
    if(mats[0]===mats[1]){geo.clearGroups();g.add(new THREE.Mesh(geo,mats[0]));}
    else porMaterial(geo).forEach(([mi,gg])=>g.add(new THREE.Mesh(gg,mats[mi])));});return g;}
function caixa(cs){let a=[1e9,1e9,-1e9,-1e9];cs.forEach(c=>c.outer.forEach(([x,y])=>{a[0]=Math.min(a[0],x);a[1]=Math.min(a[1],y);

function ancora(cs,dx,dy){const b=caixa(cs),cx=(b[0]+b[2])/2,cy=(b[1]+b[3])/2;let m=null,v=-1e9;

function ciclorama(){const W=7000*K, zF=3000*K, zc=-380*K, R=520*K, H=4000*K, pts=[[zF,0],[zc,0]];

  for(let i=0;i<pts.length-1;i++){const a=2*i;idx.push(a,a+2,a+1, a+1,a+2,a+3);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setIndex(idx);g.computeVertexNormals();
  return g;}
const cicloMat=P({color:0xefeeeb,roughness:.62,clearcoat:.12,clearcoatRoughness:.25,side:THREE.DoubleSide});
const ciclo=new THREE.Mesh(ciclorama(),cicloMat); ciclo.position.y=pisoY; scene.add(ciclo);

/* sombra de contato so para o modo rapido (no path tracing a sombra e calculada de verdade) */
function manchaTex(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const r=g.createRadialGradient(128,128,6,128,128,128);r.addColorStop(0,'rgba(0,0,0,.6)');r.addColorStop(.5,'rgba(0,0,0,.22)');
  r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);}
const peg=C.base?caixa(C.base.contornos):[bb[0],-15,bb[2],15];
const ao=new THREE.Mesh(new THREE.PlaneGeometry((peg[2]-peg[0])*1.35,Math.max(30,peg[3]-peg[1])*2.4),
  new THREE.MeshBasicMaterial({map:manchaTex(),transparent:true,depthWrite:false,opacity:.55}));
ao.rotation.x=-Math.PI/2; ao.position.set((peg[0]+peg[2])/2-cx,pisoY+.15,0); scene.add(ao);

/* softbox principal (sombra macia e direcional) e recorte traseiro (acende a aresta do cristal) */
function softbox(w,h,I,pos,cor=0xffffff){const l=new THREE.RectAreaLight(cor,I,w*K,h*K);l.position.set(...pos.map(v=>v*K));l.lookAt(0,0,0);scene.add(l);return l;}
const kKey=softbox(320,300,14,[70,470,180],0xfffaf2);
const kRim=softbox(600,220,3.2,[-260,360,-520],0xeef4ff);
const SEMLUZ=Q.has('semluz');

const cam=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,1,20000*K);
const ctl=new OrbitControls(cam,ren.domElement);
Object.assign(ctl,{enableDamping:true,dampingFactor:.08,enablePan:false,minDistance:230*K,maxDistance:1300*K,
  maxPolarAngle:Math.PI*.495,autoRotateSpeed:1.2});

/* ---------- path tracing progressivo ---------- */
let pt=null;
if(PT){try{pt=new PT.WebGLPathTracer(ren);
  const fraco=matchMedia('(pointer:coarse)').matches;
  Object.assign(pt,{bounces:6,transmissiveBounces:12,filterGlossyFactor:.4,minSamples:3,renderDelay:180,fadeDuration:450,
    renderScale:fraco?.6:1,dynamicLowRes:false,rasterizeScene:true});
  pt.tiles.set(fraco?3:2,fraco?3:2);
 }catch(e){console.warn(e);pt=null;}}
const ALVO=600, MAX=2400;
function reconstroi(){if(pt){pt.setScene(scene,cam);}}
function cameraMudou(){if(pt)pt.updateCamera();}

let tema=Q.get('tema')||C.tema||'claro';
function aplicaTema(){const e=tema==='escuro';
  scene.environment=AMB[tema]; scene.background=new THREE.Color(e?0x17191e:0xecebe8);
  cicloMat.color.set(e?0x1d2026:0xefeeeb); cicloMat.roughness=e?.38:.62; cicloMat.clearcoat=e?.55:.12;
  kKey.intensity=SEMLUZ?0:(e?16:14)*ESC; kRim.intensity=SEMLUZ?0:(e?4.6:3.2)*ESC; ao.material.opacity=e?.7:.55;
  document.body.classList.toggle('escuro',e); bT.setAttribute('aria-pressed',e);
  if(pt){pt.updateMaterials();pt.updateEnvironment();pt.updateLights();}}

/* ---------- vistas, explosao, rotulos ---------- */
const SUB=C.base?40*K:0, GAP=30*K, nN=niveis.length;
const V={frente:[0,70,560],tresq:[330,190,430],lado:[540,105,150],verso:[-210,125,-520],cima:[150,520,250],camadas:[610,215,250]};
/* em tela em pe (celular) a largura limita: afasta a camera na proporcao */
const ASP=innerWidth/innerHeight, FT=ASP<1.2?Math.min(2.3,1.2/ASP*.8):1;
for(const k in V)V[k]=V[k].map(v=>v*K*FT);
ctl.maxDistance*=FT; ctl.minDistance*=Math.min(FT,1.3);
let tw=null,expA=0,exp=0,expParado=true;
const ALVO_Y=24*K; /* sobe a peca na tela, acima dos botoes */
function vai(nome){const [x,y,z]=V[nome];
  const tB=expA?new THREE.Vector3(0,SUB/2-ALVO_Y,GAP*(nN-1)/2):new THREE.Vector3(0,-ALVO_Y,0);
  const sA=new THREE.Spherical().setFromVector3(cam.position.clone().sub(ctl.target));
  const sB=new THREE.Spherical().setFromVector3(new THREE.Vector3(x,y,z));
  let dT=sB.theta-sA.theta;while(dT>Math.PI)dT-=2*Math.PI;while(dT<-Math.PI)dT+=2*Math.PI;
  tw={sA,sB,dT,tA:ctl.target.clone(),tB,t0:performance.now(),dur:1050};marcaVista(nome);}
function marcaVista(n){document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===n));}
ctl.target.set(0,-ALVO_Y,0); cam.position.set(V.tresq[0],V.tresq[1]-ALVO_Y,V.tresq[2]); ctl.update();

const bG=document.getElementById('bGira'),bC=document.getElementById('bCam'),bT=document.getElementById('bTema'),bF=document.getElementById('bFoto');
if(nN<2&&!C.base)bC.style.display='none';
if(!pt)bF.style.display='none';
function setGira(v){ctl.autoRotate=v;bG.setAttribute('aria-pressed',v);}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{setGira(false);vai(b.dataset.v);});
bG.onclick=()=>setGira(!ctl.autoRotate);
bC.onclick=()=>{expA=expA?0:1;bC.setAttribute('aria-pressed',!!expA);bC.textContent=expA?'Montar peça':'Ver camadas';
  setGira(false);vai(expA?'camadas':'tresq');if(expA)marcaVista('');expParado=false;if(pt)pt.enablePathTracing=false;};
bT.onclick=()=>{tema=tema==='escuro'?'claro':'escuro';bT.textContent=tema==='escuro'?'Estúdio claro':'Estúdio escuro';aplicaTema();};
bF.onclick=()=>{const a=document.createElement('a');a.download=(C.titulo||'peca').replace(/[^\wÀ-ſ -]+/g,'').trim()+'.png';
  a.href=ren.domElement.toDataURL('image/png');a.click();};
ctl.addEventListener('start',()=>{tw=null;setGira(false);marcaVista('');});
ctl.addEventListener('change',cameraMudou);

const DIR=[[.3,1],[1,.2],[-1,-.5],[1,-.7],[-1,.8],[-.5,-1],[.8,.9]];
const ROT=objs.map((o,i)=>{const p=o.l.rotulo||ancora(o.l.contornos,...DIR[i%DIR.length]);return{t:o.l.nome,o:o.g,p:[p[0],p[1],o.l.esp]};});
if(C.base){const p=ancora(C.base.contornos,1,-.6);ROT.push({t:C.base.nome,o:base,p:[p[0],p[1],C.base.esp]});}
const caixaRot=document.getElementById('rotulos');
ROT.forEach(r=>{const d=document.createElement('div');d.className='rot';d.innerHTML='<i></i><span></span>';
  d.querySelector('span').textContent=r.t;caixaRot.appendChild(d);r.el=d;r.v=new THREE.Vector3();});
function rotulos(){const op=Math.max(0,Math.min(1,(exp-.45)/.4));
  ROT.forEach(r=>{r.v.set(...r.p).applyMatrix4(r.o.matrixWorld).project(cam);
    const x=(r.v.x*.5+.5)*innerWidth,y=(-r.v.y*.5+.5)*innerHeight,esq=x>innerWidth*.6;
    r.el.classList.toggle('esq',esq);
    r.el.style.transform='translate('+(esq?x-r.el.offsetWidth+4:x-4)+'px,'+(y-r.el.offsetHeight/2)+'px)';
    r.el.style.opacity=r.v.z<1?op:0;});}

const estTx=document.getElementById('estTx'),barra=document.getElementById('barra'),barraI=barra.querySelector('i');
let dicaVista=false;
function status(){if(!pt)return;const s=pt.samples|0;
  if(!pt.enablePathTracing||s<1){if(dicaVista){estTx.textContent='Solte para renderizar';}barra.hidden=true;bF.disabled=true;return;}
  dicaVista=true;
  if(s>=ALVO){estTx.textContent='Renderização realista';barra.hidden=true;}
  else{estTx.textContent='Renderizando luz real';barra.hidden=false;barraI.style.width=Math.min(100,s/ALVO*100)+'%';}
  bF.disabled=s<Math.min(120,ALVO);
  pt.pausePathTracing=s>=MAX;}

addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);cameraMudou();});
const ease=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
aplicaTema(); reconstroi();
let n=0,tAnt=performance.now();
ren.setAnimationLoop(()=>{
  const agora=performance.now(),dt=Math.min(.1,(agora-tAnt)/1000);tAnt=agora;
  if(exp!==expA){exp+=(expA-exp)*(1-Math.exp(-dt*4.5));if(Math.abs(expA-exp)<1e-3)exp=expA;
    pilha.position.y=SUB*exp;objs.forEach(o=>o.g.position.z=o.z0+o.ordem*GAP*exp);}
  else if(!expParado){expParado=true;if(pt){reconstroi();pt.enablePathTracing=true;}}
  if(tw){const k=ease(Math.min(1,(agora-tw.t0)/tw.dur));
    const s=new THREE.Spherical(tw.sA.radius+(tw.sB.radius-tw.sA.radius)*k,tw.sA.phi+(tw.sB.phi-tw.sA.phi)*k,tw.sA.theta+tw.dT*k);
    ctl.target.lerpVectors(tw.tA,tw.tB,k);cam.position.setFromSpherical(s).add(ctl.target);cameraMudou();if(k>=1)tw=null;}
  ctl.update();
  if(pt){pt.renderSample();}else{ren.render(scene,cam);}
  rotulos();status();
  if(++n===3){const c=document.getElementById('carr');c.classList.add('off');setTimeout(()=>c.remove(),600);document.body.dataset.pronto='1';}
});
window.__pt=()=>pt?pt.samples:-1;
</script></body></html>
