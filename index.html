<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>70 Anos · Display de Mesa</title>
<style>
:root{--tx:#eef2fb;--tx2:rgba(238,242,251,.6);--btn:rgba(255,255,255,.09);--btnb:rgba(255,255,255,.2);
  --btnh:rgba(255,255,255,.18);--on:#fff;--ontx:#13204a;--rot:rgba(9,16,40,.78);--rottx:#fff;--bg:#0b1430}
body.claro{--tx:#16203c;--tx2:#5a6479;--btn:rgba(255,255,255,.75);--btnb:rgba(20,30,60,.14);
  --btnh:#fff;--on:#16203c;--ontx:#fff;--rot:rgba(255,255,255,.94);--rottx:#16203c;--bg:#e4e8f0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#app{position:fixed;inset:0}canvas{display:block;touch-action:none}
#cap{position:fixed;top:0;left:0;right:0;padding:calc(18px + env(safe-area-inset-top)) 18px 0;text-align:center;pointer-events:none;z-index:3}
#cap h1{font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
#cap p{font-size:12px;margin-top:6px;color:var(--tx2);letter-spacing:.03em;line-height:1.5}
#hud{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(14px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:3}
.lin{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--btn);border:1px solid var(--btnb);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:auto}
.seg button{border:0;background:transparent}
button{pointer-events:auto;border:1px solid var(--btnb);background:var(--btn);color:var(--tx);font:inherit;font-size:13px;
  letter-spacing:.02em;padding:8px 15px;border-radius:999px;cursor:pointer;backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);transition:background .2s,color .2s}
button:hover{background:var(--btnh)}
button[aria-pressed="true"]{background:var(--on);color:var(--ontx)}
#dica{font-size:11.5px;color:var(--tx2);letter-spacing:.04em;transition:opacity .6s}
#dica.off{opacity:0}
.rot{position:fixed;left:0;top:0;z-index:2;pointer-events:none;display:flex;align-items:center;gap:7px;
  opacity:0;white-space:nowrap}
.rot i{width:8px;height:8px;border-radius:50%;background:var(--rottx);box-shadow:0 0 0 3px var(--rot);flex:none}
.rot span{font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--rottx);background:var(--rot);
  padding:5px 10px;border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.rot.esq{flex-direction:row-reverse}
#carr{position:fixed;inset:0;display:grid;place-items:center;font-size:13px;letter-spacing:.1em;color:var(--tx2);
  background:var(--bg);transition:opacity .5s;z-index:9}
#carr.off{opacity:0;pointer-events:none}
@media (max-width:560px){#cap h1{font-size:13px}#cap p{font-size:11px}button{font-size:12px;padding:7px 12px}}
</style></head><body>
<div id="app"></div>
<div id="cap"><h1>70 Anos &middot; Display de Mesa</h1>
<p>20 &times; 18 &times; 5 cm<br>Cristal 5 mm &middot; Espelhado dourado 2 mm &middot; Branco 3 mm &middot; Base cristal 12 mm</p></div>
<div id="rotulos"></div>
<div id="hud">
  <div id="dica">Arraste para girar &middot; pince ou role para aproximar</div>
  <div class="lin">
    <div class="seg" role="group" aria-label="Vistas">
      <button data-v="frente">Frente</button><button data-v="tresq" aria-pressed="true">3/4</button>
      <button data-v="lado">Lado</button><button data-v="verso">Verso</button>
    </div>
  </div>
  <div class="lin">
    <button id="bCam" aria-pressed="false">Ver camadas</button>
    <button id="bGira" aria-pressed="true">Girar</button>
    <button id="bTema" aria-pressed="false">Fundo claro</button>
  </div>
</div>
<div id="carr">carregando…</div>

/* estudio de reflexo: caixa escura com softboxes. O contraste e o que faz o dourado ler como espelho
   e o que acende a aresta polida do cristal. */
function estudio(){
  const e=new THREE.Scene(), cx=new THREE.BoxGeometry(1,1,1); cx.deleteAttribute('uv');
  const box=(cor,k,p,s)=>{const o=new THREE.Mesh(cx,new THREE.MeshBasicMaterial({color:new THREE.Color(cor).multiplyScalar(k)}));
    o.position.set(...p); o.scale.set(...s); e.add(o);};
  e.add(new THREE.Mesh(new THREE.BoxGeometry(60,32,60),new THREE.MeshBasicMaterial({color:0x2b3040,side:THREE.BackSide})));
  box(0xffffff,22,[0,15.2,2],[20,.3,16]);
  box(0xfff0d6,17,[-18,6,6],[.3,13,16]);
  box(0xd9e9ff,13,[18,7,-4],[.3,13,16]);
  box(0xffffff,9,[0,4,-21],[26,13,.3]);
  box(0xfff0d4,1.35,[0,6,24],[46,26,.3]);
  box(0xffffff,16,[-12,11,20],[13,8,.3]);
  box(0xfff2dc,11,[13,0,20],[9,11,.3]);
  box(0x11141c,1,[0,-14,0],[40,.3,40]);
  return e;
}
scene.environment=new THREE.PMREMGenerator(ren).fromScene(estudio(),0.02).texture;

/* fundo em gradiente de tela: sem piso com borda, sem horizonte, sem o arco que aparecia */
function gradiente(c1,c2){const c=document.createElement('canvas');c.width=c.height=1024;const g=c.getContext('2d');
  const r=g.createRadialGradient(512,620,30,512,560,800);r.addColorStop(0,c1);r.addColorStop(1,c2);
  g.fillStyle=r;g.fillRect(0,0,1024,1024);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
function manchaTex(){const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d');
  const r=g.createRadialGradient(128,128,8,128,128,128);r.addColorStop(0,'rgba(0,0,0,.85)');r.addColorStop(.55,'rgba(0,0,0,.35)');
  r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,256,256);return new THREE.CanvasTexture(c);}

  specularIntensity:.7,clearcoat:.55,clearcoatRoughness:.06,attenuationColor:new THREE.Color(0xcdeee6),
  attenuationDistance:140,envMapIntensity:.95});

  clearcoat:1,clearcoatRoughness:.04,envMapIntensity:1.8,attenuationColor:new THREE.Color(0x6fc8b3),attenuationDistance:7});
const M={

function forma(c){const s=new THREE.Shape();c.outer.forEach(([x,y],i)=>i?s.lineTo(x,y):s.moveTo(x,y));
  (c.holes||[]).forEach(h=>{const p=new THREE.Path();h.forEach(([x,y],i)=>i?p.lineTo(x,y):p.moveTo(x,y));s.holes.push(p);});return s;}
function solido(cs,esp,mats,bisel,sombra){const g=new THREE.Group();
  cs.forEach(c=>{const geo=new THREE.ExtrudeGeometry(forma(c),{depth:esp,bevelEnabled:bisel,bevelThickness:B,bevelSize:B,bevelSegments:2,curveSegments:12});
    const m=new THREE.Mesh(geo,mats);m.castShadow=sombra;m.receiveShadow=true;g.add(m);});return g;}
function caixa(cs){let a=[1e9,1e9,-1e9,-1e9];cs.forEach(c=>c.outer.forEach(([x,y])=>{a[0]=Math.min(a[0],x);a[1]=Math.min(a[1],y);
  a[2]=Math.max(a[2],x);a[3]=Math.max(a[3],y);}));return a;}

/* empilhamento com folga real entre camadas: era a sobreposicao do adesivo com o bisel do cristal
   que gerava o chuviscado no verso */
const zCris=-D.painelE/2, frenteCris=D.painelE/2+B;
const zVinil=frenteCris+.06, zOuro=zVinil+D.adesivoE+.05+B, zAnos=zOuro+D.douradoE+B+.05+B;
const painel=solido(G.painel,D.painelE,M.cristal,true,false); painel.position.z=zCris;
const vinil=solido(G.adesivo,D.adesivoE,[M.vinil,M.vinil],false,true); vinil.position.z=zVinil;
const ouro=solido(G.num,D.douradoE,M.ouro,true,true); ouro.position.z=zOuro;
const anos=solido(G.anos,D.brancoE,M.branco,true,true); anos.position.z=zAnos;
const pilha=new THREE.Group(); pilha.add(painel,vinil,ouro,anos);
const base=solido(G.base,D.baseE,M.base,true,false);
base.rotation.x=-Math.PI/2; base.position.set(0,-D.baseE,D.baseP/2);
const peca=new THREE.Group(); peca.add(pilha,base);
const alvoY=(D.painelH-D.baseE)/2;
peca.position.set(-D.baseL/2,-alvoY,0); scene.add(peca);

const piso=new THREE.Mesh(new THREE.PlaneGeometry(5000,5000),new THREE.ShadowMaterial({opacity:.45}));
piso.rotation.x=-Math.PI/2; piso.position.y=pisoY; piso.receiveShadow=true; scene.add(piso);

/* vistas com transicao suave em coordenadas esfericas: a camera contorna a peca em vez de atravessa-la */
const V={frente:[0,85,555],tresq:[330,200,425],lado:[520,110,150],verso:[-200,130,-510],camadas:[610,215,250]};
let tw=null,expA=0,exp=0;
function vai(nome){const [x,y,z]=V[nome];
  const tB=expA?new THREE.Vector3(0,22,40):new THREE.Vector3(0,0,0);
  const sA=new THREE.Spherical().setFromVector3(cam.position.clone().sub(ctl.target));
  const sB=new THREE.Spherical().setFromVector3(new THREE.Vector3(x,y,z));
  let dT=sB.theta-sA.theta;while(dT>Math.PI)dT-=2*Math.PI;while(dT<-Math.PI)dT+=2*Math.PI;
  tw={sA,sB,dT,tA:ctl.target.clone(),tB,t0:performance.now(),dur:1050};
  marcaVista(nome);}
function marcaVista(n){document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===n));}

  {t:'Branco · 3 mm',o:anos,p:[bA[2]-14,bA[3]-10,D.brancoE]},
  {t:'Espelhado dourado · 2 mm',o:ouro,p:[bN[0]+70,bN[3]-6,D.douradoE]},
  {t:'Adesivo branco',o:vinil,p:[bN[0]+16,bN[1]+10,D.adesivoE]},

function rotulos(){const op=Math.max(0,Math.min(1,(exp-.45)/.4));
  ROT.forEach(r=>{r.v.set(...r.p).applyMatrix4(r.o.matrixWorld).project(cam);
    const x=(r.v.x*.5+.5)*innerWidth,y=(-r.v.y*.5+.5)*innerHeight,esq=x>innerWidth*.6;
    r.el.classList.toggle('esq',esq);
    r.el.style.transform='translate('+(esq?x-r.el.offsetWidth+4:x-4)+'px,'+(y-r.el.offsetHeight/2)+'px)';
    r.el.style.opacity=r.v.z<1?op:0;});}

  const agora=performance.now(),dt=Math.min(.1,(agora-tAnt)/1000);tAnt=agora;
  exp+=(expA-exp)*(1-Math.exp(-dt*4.5)); if(Math.abs(expA-exp)<1e-3)exp=expA;
  pilha.position.y=40*exp; vinil.position.z=zVinil+30*exp; ouro.position.z=zOuro+62*exp; anos.position.z=zAnos+94*exp;
  if(tw){const k=ease(Math.min(1,(performance.now()-tw.t0)/tw.dur));
    const s=new THREE.Spherical(tw.sA.radius+(tw.sB.radius-tw.sA.radius)*k,tw.sA.phi+(tw.sB.phi-tw.sA.phi)*k,tw.sA.theta+tw.dT*k);
    ctl.target.lerpVectors(tw.tA,tw.tB,k);cam.position.setFromSpherical(s).add(ctl.target);if(k>=1)tw=null;}
  ctl.update();ren.render(scene,cam);rotulos();
  if(++n===3){const c=document.getElementById('carr');c.classList.add('off');setTimeout(()=>c.remove(),600);document.body.dataset.pronto='1';}
})();
</script></body></html>
